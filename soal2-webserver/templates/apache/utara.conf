<VirtualHost *:${UTARA_PORT}>
    ServerName ${HOST_UTARA}
    ServerAlias ${HOST_WWW}
    DocumentRoot ${UTARA_DOCROOT}

    <Directory ${UTARA_DOCROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Owner-By "${PESERTA_NAMA}"
    Header always set X-Served-By "apache2"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/utara-error.log
    CustomLog ${APACHE_LOG_DIR}/utara-access.log sevima
</VirtualHost>
