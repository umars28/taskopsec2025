global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    ca-base /etc/ssl/certs
    crt-base ${HAPROXY_CERT_DIR}
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    http-reuse safe
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 30s
    errorfile 503 /etc/haproxy/errors/503.http

frontend fe_http
    bind :::${HAPROXY_HTTP_PORT} v4v6
    http-request redirect scheme https code 301

frontend fe_https
    bind :::${HAPROXY_HTTPS_PORT} v4v6 ssl crt-list ${HAPROXY_CRTLIST}

    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]

    http-request deny unless METH_GET || METH_HEAD || METH_POST || METH_OPTIONS

    http-response set-header Strict-Transport-Security "max-age=${HSTS_MAX_AGE}"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header Referrer-Policy "no-referrer"

    stick-table type ip size 200k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    acl host_barat hdr(host) -i ${HOST_BARAT}
    acl host_barat hdr(host) -i ${HOST_BARAT}:${HAPROXY_HTTPS_PORT}
    acl host_www   hdr(host) -i ${HOST_WWW}
    acl host_www   hdr(host) -i ${DOMAIN_BASE}

    use_backend be_barat if host_barat
    use_backend be_www   if host_www
    default_backend be_www

backend be_www
    balance roundrobin
    option httpchk
    http-check send meth GET uri / hdr Host ${HOST_WWW}
    http-check expect status 200
    server utara 127.0.0.1:${UTARA_PORT} check inter 3s fall 3 rise 2
    server timur 127.0.0.1:${TIMUR_PORT} check inter 3s fall 3 rise 2

backend be_barat
    option httpchk
    http-check send meth GET uri / hdr Host ${HOST_BARAT}
    http-check expect status 200
    server barat 127.0.0.1:${BARAT_HTTPS_PORT} ssl verify required ca-file ${CA_TRUST_FILE} sni str(${HOST_BARAT}) check

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
